[tox]
envlist = py

[testenv]
passenv = 
    MARQO_API_KEY
    MARQO_URL
whitelist_externals =
  python
deps =
  -r requirements-dev.txt
commands =
  pytest {posargs}

[testenv:cloud_tests]
passenv =
    MARQO_CLOUD_URL # Variable that config uses to determine whether MARQO_URL is a Marqo Cloud URL
    MARQO_API_KEY # This is the API key used to authenticate with the cloud
    MARQO_URL # Actual Marqo Cloud URL to use for tests
    MARQO_GITHUB_RUN_ID # this is used to identify indexes between test runs.
    MQ_TEST_RUN_IDENTIFIER # this is used to identify indexes between test runs. If blank it will be randomly generated
whitelist_externals =
  python
deps =
    {[testenv]deps}
    pytest-html
commands =
    python -u tests/cloud_test_logic/run_cloud_tests.py {posargs}